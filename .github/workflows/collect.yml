name: Collect job postings

on:
  schedule:
    # 10:00 UTC ≈ noon Europe/Copenhagen in summer (CEST, UTC+2),
    # ≈ 11:00 local in winter (CET, UTC+1) — GitHub Actions cron is
    # UTC-only, so the local time drifts ~1h across the DST changeovers.
    - cron: "0 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run collector
        # collect.py exits 1 whenever any single company's fetch fails
        # (e.g. an ATS endpoint returning an error) — that's surfaced as a
        # warning banner on the report itself, not something that should
        # block the commit/Pages steps below for every other company that
        # succeeded.
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m jobcollator.collect

      - name: Commit updated job data
        run: |
          git config user.name "job-collator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.db companies.json
          git diff --quiet --cached || git commit -m "Automated data update $(date -u +%Y-%m-%d)"
          git push

      - name: Prepare dashboard for Pages
        run: |
          mkdir -p public
          cp data/report.html public/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
