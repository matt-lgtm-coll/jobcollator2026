name: Collect job postings

on:
  schedule:
    # GitHub runs scheduled workflows on a best-effort basis: starts are
    # often hours late, and now and then a day is skipped entirely.
    # Main run: 05:23 UTC (06:23 Copenhagen in winter, 07:23 in summer),
    # early and off the hour so even a long delay lands by late morning.
    - cron: "23 5 * * *"
    # Backup at 12:47 UTC. Either scheduled run is skipped if a run has
    # already succeeded today (UTC); see the gate job.
    - cron: "47 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Manual runs always go ahead; a scheduled run is skipped if
          # another run (either schedule, or a manual one) already
          # succeeded today, so a late main run and the backup never
          # both do the work.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today=$(date -u +%Y-%m-%d)
          done_today=$(gh api "repos/${{ github.repository }}/actions/workflows/collect.yml/runs?status=success&created=>=${today}" \
            --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }})] | length" || echo 0)
          if [ "$done_today" -gt 0 ]; then
            echo "Already ran successfully today; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No successful run yet today; collecting."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  collect:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run collector
        # collect.py exits 1 whenever any single company's fetch fails
        # (e.g. an ATS endpoint returning an error) — that's surfaced as a
        # warning banner on the report itself, not something that should
        # block the commit/Pages steps below for every other company that
        # succeeded.
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m jobcollator.collect

      - name: Commit updated job data
        run: |
          git config user.name "job-collator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.db companies.json
          git diff --quiet --cached || git commit -m "Automated data update $(date -u +%Y-%m-%d)"
          git push

      - name: Prepare dashboard for Pages
        run: |
          mkdir -p public
          cp data/report.html public/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
